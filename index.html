<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADF Enterprise Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .ios-input { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 14px; outline: none; transition: all 0.2s; width: 100%; font-size: 14px; }
        .ios-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .ios-input:disabled { background: #f1f5f9; color: #94a3b8; }
        .ios-btn { background: #3b82f6; color: white; border-radius: 12px; padding: 14px; font-weight: 600; font-size: 15px; transition: transform 0.1s; text-align: center; cursor: pointer; }
        .ios-btn:active { transform: scale(0.97); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .photo-thumb { transition: transform 0.2s; cursor: zoom-in; }
        .photo-thumb:hover { transform: scale(1.05); }
    </style>
</head>
<body class="text-gray-800 pb-20 md:pb-0">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
        <div class="glass-panel w-full max-w-sm p-8 rounded-3xl shadow-xl border border-gray-100">
            <div class="text-center mb-8">
                <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold">ADF Portal</h1>
                <p class="text-sm text-gray-500 mt-1">Gunakan NIK Anda untuk Sign In</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="nik" class="ios-input" placeholder="Username (NIK)" onkeypress="handleLoginEnter(event)">
                <input type="password" id="password" class="ios-input" placeholder="Password" onkeypress="handleLoginEnter(event)">
                <button onclick="login()" class="ios-btn w-full shadow-lg mt-2">Masuk</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="mainScreen" class="hidden min-h-screen flex flex-col">
        <!-- HEADER -->
        <header class="glass-panel sticky top-0 z-40 border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <div>
                <h2 class="text-lg font-bold text-gray-900" id="userNameDisplay">Halo, User</h2>
                <div class="flex gap-2 mt-1">
                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span id="roleDisplay">Role</span>
                    </span>
                    <span class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full font-semibold flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        <span id="placeDisplay">Store</span>
                    </span>
                </div>
            </div>
            <button onclick="logout()" class="hidden md:flex text-red-500 font-bold bg-red-50 px-4 py-2 rounded-xl hover:bg-red-100 transition items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> Keluar
            </button>
        </header>

        <main class="flex-1 w-full max-w-5xl mx-auto p-4 md:p-6 relative">
            
            <!-- TAB 1: FORM PENGAJUAN (Khusus Staff) -->
            <section id="tabForm" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-xl text-gray-800 mb-6 flex items-center gap-2">
                        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> 
                        Buat Pengajuan ADF
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <!-- Barcode Scanner -->
                        <div class="col-span-1 md:col-span-2">
                            <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Scan / Input SKU atau KLS</label>
                            <div class="flex gap-2">
                                <input type="text" id="sku" class="ios-input font-mono" placeholder="Ketik SKU/KLS..." onchange="checkSKU()">
                                <button onclick="startScan()" class="bg-gray-800 text-white px-5 rounded-xl hover:bg-gray-700 flex items-center gap-2 flex-shrink-0 shadow-md">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h4a1 1 0 010 2H5v3a1 1 0 01-2 0V4zm14-1a1 1 0 011 1v3a1 1 0 01-2 0V5h-3a1 1 0 010-2h4zM4 17a1 1 0 012 0v3h3a1 1 0 010 2H5a2 2 0 01-2-2v-3a1 1 0 011-1zm15 0a1 1 0 011 1v3a2 2 0 01-2 2h-4a1 1 0 010-2h3v-3a1 1 0 011-1z"></path></svg>
                                    Scan
                                </button>
                            </div>
                        </div>
                        <div id="reader" class="hidden w-full col-span-1 md:col-span-2 rounded-2xl overflow-hidden bg-black shadow-inner h-64"></div>
                        
                        <!-- Inputs Auto-fill -->
                        <div class="col-span-1 md:col-span-2">
                            <label class="text-xs font-semibold text-gray-500 mb-1 block">Deskripsi Produk</label>
                            <input type="text" id="desc" class="ios-input" disabled placeholder="Deskripsi Barang">
                        </div>
                        <div><label class="text-xs font-semibold text-gray-500 mb-1 block">Department</label><input type="text" id="dept" class="ios-input" disabled placeholder="Department"></div>
                        <div><label class="text-xs font-semibold text-gray-500 mb-1 block">Commodity</label><input type="text" id="commodity" class="ios-input" disabled placeholder="Commodity"></div>
                        <div><label class="text-xs font-semibold text-gray-500 mb-1 block">Price</label><input type="number" id="price" class="ios-input font-mono" disabled placeholder="0"></div>
                        <div><label class="text-xs font-semibold text-gray-500 mb-1 block">Qty</label><input type="number" id="qty" class="ios-input" placeholder="1" min="1" value="1"></div>
                        <div><label class="text-xs font-semibold text-gray-500 mb-1 block">Proposal</label><select id="proposal" class="ios-input bg-white"></select></div>
                        <div><label class="text-xs font-semibold text-gray-500 mb-1 block">Discount Amount (Rp)</label><input type="number" id="discountAmount" class="ios-input font-mono" placeholder="15000"></div>
                        
                        <!-- Info Caused By -->
                        <div>
                            <label class="text-xs font-semibold text-gray-500 mb-1 block">Caused By</label>
                            <div class="flex gap-2">
                                <select id="causedBy" class="ios-input bg-white"></select>
                                <button type="button" onclick="showCausedByInfo()" class="bg-blue-100 text-blue-600 px-4 rounded-xl text-sm font-bold hover:bg-blue-200 shadow-sm flex-shrink-0">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div><label class="text-xs font-semibold text-gray-500 mb-1 block">No Doc (LPPB/DO/SR)</label><input type="text" id="docNo" class="ios-input" placeholder="Opsional"></div>
                        
                        <!-- Reason -->
                        <div class="col-span-1 md:col-span-2"><label class="text-xs font-semibold text-gray-500 mb-1 block">Alasan</label><textarea id="reason" class="ios-input h-24 resize-none" placeholder="Tulis alasan lengkap..."></textarea></div>
                        
                        <!-- Photo Upload SVG -->
                        <div class="col-span-1 md:col-span-2">
                            <label class="text-xs font-semibold text-gray-500 mb-1 block">Upload Bukti Foto (Min 2, Max 3)</label>
                            <div class="relative border-2 border-dashed border-blue-300 bg-blue-50 rounded-2xl p-6 text-center hover:bg-blue-100 transition cursor-pointer">
                                <input type="file" id="photos" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" multiple accept="image/*" onchange="updateFileCount()">
                                <div class="flex flex-col items-center pointer-events-none">
                                    <svg class="w-10 h-10 text-blue-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    <p class="text-sm font-semibold text-blue-700" id="fileText">Ketuk untuk Kamera / Galeri</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button onclick="submitForm()" class="ios-btn w-full shadow-lg shadow-blue-500/30 mt-8 text-lg py-4 flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        Kirim Pengajuan ADF
                    </button>
                </div>
            </section>

            <!-- TAB 2: HISTORY & APPROVAL -->
            <section id="tabHistory" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            Cari & Filter Data
                        </h3>
                        <button onclick="fetchHistory()" class="bg-blue-50 text-blue-600 p-2 rounded-xl hover:bg-blue-100 shadow-sm transition-transform active:scale-95">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" onkeyup="applyFilters()" class="ios-input w-2/3 text-sm" placeholder="Cari SKU, Trans No, Deskripsi...">
                        <select id="sortSLA" onchange="applyFilters()" class="ios-input w-1/3 text-sm bg-gray-50">
                            <option value="NEWEST">Terbaru</option>
                            <option value="SLA_DESC">SLA Terlama</option>
                        </select>
                    </div>
                </div>

                <!-- Desktop Table View -->
                <div class="hidden md:block bg-white rounded-2xl shadow-sm border border-gray-100 overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 text-gray-600 font-semibold border-b">
                            <tr>
                                <th class="p-4">Tanggal</th>
                                <th class="p-4">Trans No / Store</th>
                                <th class="p-4">Item</th>
                                <th class="p-4">SLA Time</th>
                                <th class="p-4">Status</th>
                            </tr>
                        </thead>
                        <tbody id="desktopTableBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>

                <!-- Mobile Card View -->
                <div class="grid grid-cols-1 gap-4 md:hidden pb-10" id="mobileCardBody"></div>
            </section>
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="fixed bottom-0 w-full glass-panel border-t border-gray-200 z-40 pb-safe px-2">
            <div class="max-w-md mx-auto flex justify-around p-2">
                <button id="navFormBtn" onclick="switchTab('tabForm')" class="flex-1 flex flex-col items-center p-2 text-blue-600 font-semibold hidden">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span class="text-[10px]">Buat Baru</span>
                </button>
                <button id="navHistoryBtn" onclick="switchTab('tabHistory')" class="flex-1 flex flex-col items-center p-2 text-gray-400 hover:text-blue-500 transition-colors">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    <span class="text-[10px]">Task / History</span>
                </button>
                <button onclick="logout()" class="md:hidden flex-1 flex flex-col items-center p-2 text-red-400 hover:text-red-500 transition-colors">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    <span class="text-[10px]">Keluar</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- DETAIL MODAL -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 glass-panel">
        <div class="bg-white w-full max-w-2xl max-h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-200">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2" id="detailTransNo">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    ADF/--
                </h3>
                <button onclick="closeDetailModal()" class="bg-gray-200 text-gray-600 rounded-full p-2 hover:bg-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4 text-sm" id="detailContent">
                <!-- Injected via JS -->
            </div>
            <div class="p-4 border-t border-gray-100 bg-gray-50 flex gap-3" id="detailActionBtn">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxy2WqYpi0sXo5Neud3Xelon2tHgHBTmqrNjy8fENDgtOO1VKJsookpFRbswgWaN8eNEQ/exec'; 
        let currentUser = {};
        let masterCausedBy = [];
        let masterSKU = {};
        let html5QrCode;
        let allTransactions = []; 
        let userNetwork = { ip: 'Unknown', location: 'Unknown' };

        fetch('https://ipapi.co/json/').then(res => res.json()).then(data => { userNetwork.ip = data.ip; userNetwork.location = `${data.city}, ${data.country_name}`; }).catch(() => {});

        window.onload = () => {
            if (localStorage.getItem('adf_token') && localStorage.getItem('adf_user')) {
                currentUser = JSON.parse(localStorage.getItem('adf_user'));
                renderApp(); loadMasterData();
            }
        };

        // NEW: Login with ENTER Key
        function handleLoginEnter(event) {
            if (event.key === "Enter") {
                login();
            }
        }

        function switchTab(tabId) {
            document.getElementById('tabForm').classList.add('hidden');
            document.getElementById('tabHistory').classList.add('hidden');
            document.getElementById(tabId).classList.remove('hidden');

            const formBtn = document.getElementById('navFormBtn');
            const histBtn = document.getElementById('navHistoryBtn');
            
            if (tabId === 'tabForm') {
                formBtn.classList.replace('text-gray-400', 'text-blue-600');
                histBtn.classList.replace('text-blue-600', 'text-gray-400');
            } else {
                histBtn.classList.replace('text-gray-400', 'text-blue-600');
                formBtn.classList.replace('text-blue-600', 'text-gray-400');
                fetchHistory(); 
            }
        }

        function updateFileCount() {
            const files = document.getElementById('photos').files;
            document.getElementById('fileText').innerHTML = files.length > 0 ? `<span class="text-green-600">${files.length} Foto Siap Upload</span>` : `Ketuk untuk Kamera / Galeri`;
        }

        function login() {
            const nik = document.getElementById('nik').value, pw = document.getElementById('password').value;
            if(!nik || !pw) return Swal.fire('Error', 'NIK & Password wajib diisi', 'error');
            Swal.fire({ title: 'Logging in...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', nik, password: pw, ip: userNetwork.ip, location: userNetwork.location }) })
            .then(res => res.json()).then(res => {
                if(res.status === 'success') {
                    localStorage.setItem('adf_token', res.token); localStorage.setItem('adf_user', JSON.stringify(res.user));
                    currentUser = res.user; Swal.close(); renderApp(); loadMasterData();
                } else Swal.fire('Gagal', res.message, 'error');
            }).catch(e => {
                Swal.fire('Error', 'Gagal Terhubung. Pastikan URL API Benar.', 'error');
            });
        }

        function logout() { fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'logout', nik: currentUser.nik, token: localStorage.getItem('adf_token') }) }).finally(() => { localStorage.clear(); location.reload(); }); }

        function renderApp() {
            document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = currentUser.nama; document.getElementById('roleDisplay').innerText = currentUser.role; document.getElementById('placeDisplay').innerText = currentUser.place;
            if (currentUser.role === 'Staff') { document.getElementById('navFormBtn').classList.remove('hidden'); switchTab('tabForm'); } else switchTab('tabHistory');
        }

        function loadMasterData() {
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getMasterData' }) }).then(r => r.json()).then(data => {
                if(data.status === 'success') {
                    masterCausedBy = data.causedBy; masterSKU = data.masterSKU;
                    const c = document.getElementById('causedBy'); c.innerHTML = '<option value="">-- Pilih --</option>'; masterCausedBy.forEach(i => c.innerHTML += `<option value="${i.causeName}">${i.causeName}</option>`);
                    const p = document.getElementById('proposal'); p.innerHTML = '<option value="">-- Pilih --</option>'; data.proposals.forEach(pr => p.innerHTML += `<option value="${pr}">${pr}</option>`);
                }
            });
        }

        function checkSKU() {
            const skuVal = document.getElementById('sku').value.trim();
            const els = ['desc', 'dept', 'commodity', 'price'].map(id => document.getElementById(id));
            if (skuVal && masterSKU[skuVal]) {
                const p = masterSKU[skuVal]; document.getElementById('sku').value = p.sku;
                els[0].value = p.description||''; els[1].value = p.dept||''; els[2].value = p.commodity||''; els[3].value = p.price||0;
                els.forEach(e => e.disabled = true);
            } else if (skuVal) { els.forEach(e => e.disabled = false); } else { els.forEach(e => { e.value = ''; e.disabled = true; }); }
        }

        function showCausedByInfo() {
            const val = document.getElementById('causedBy').value;
            if(!val) return;
            const d = masterCausedBy.find(i => i.causeName === val);
            if(d) Swal.fire({ title: d.causeName, html: `<div class="text-left"><p class="text-sm bg-gray-100 p-3 rounded mb-2">${d.keterangan}</p><p class="text-xs text-blue-600 font-bold bg-blue-50 p-2 rounded flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg> Resp: ${d.responsibility}</p></div>`});
        }

        function startScan() {
            const r = document.getElementById('reader');
            if(!r.classList.contains('hidden')) { html5QrCode.stop(); r.classList.add('hidden'); return; }
            r.classList.remove('hidden'); html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10 }, txt => { document.getElementById('sku').value = txt; checkSKU(); html5QrCode.stop(); r.classList.add('hidden'); }, err => {}).catch(() => { r.classList.add('hidden'); });
        }

        async function submitForm() {
            const payload = {
                sku: document.getElementById('sku').value.trim(), deskripsi: document.getElementById('desc').value.trim(),
                dept: document.getElementById('dept').value.trim(), commodity: document.getElementById('commodity').value.trim(),
                price: document.getElementById('price').value, proposal: document.getElementById('proposal').value,
                causedBy: document.getElementById('causedBy').value, reason: document.getElementById('reason').value.trim()
            };
            const files = document.getElementById('photos').files;
            if(!payload.sku || !payload.deskripsi || !payload.proposal || !payload.causedBy || !payload.reason) return Swal.fire('Info', 'Data belum lengkap', 'warning');
            if(files.length < 2 || files.length > 3) return Swal.fire('Info', 'Upload 2-3 foto.', 'warning');

            Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            let photosBase64 = [];
            for(let f of files) photosBase64.push(await new Promise(res => { let r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(f); }));

            const fp = { action: 'submitADF', nik: currentUser.nik, username: currentUser.username, role: currentUser.role, place: currentUser.place, token: localStorage.getItem('adf_token'), ip: userNetwork.ip, location: userNetwork.location, ...payload, qty: document.getElementById('qty').value, discountAmount: document.getElementById('discountAmount').value || 0, docNo: document.getElementById('docNo').value, photos: photosBase64 };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(fp) }).then(r => r.json()).then(res => {
                if(res.status === 'success') {
                    Swal.fire('Berhasil!', `No ADF:\n${res.transNo}`, 'success');
                    ['sku','desc','dept','commodity','price','discountAmount','docNo','reason','proposal','causedBy','photos'].forEach(id => document.getElementById(id).value = '');
                    ['desc','dept','commodity','price'].forEach(id => document.getElementById(id).disabled = true); updateFileCount();
                } else Swal.fire('Gagal', res.message, 'error');
            });
        }

        function fetchHistory() {
            document.getElementById('desktopTableBody').innerHTML = '<tr><td colspan="5" class="text-center p-4"><div class="animate-pulse flex flex-col items-center justify-center py-4"><div class="h-4 bg-gray-200 rounded w-1/4 mb-2"></div><div class="h-4 bg-gray-200 rounded w-1/3"></div></div></td></tr>';
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getTransactions', nik: currentUser.nik, token: localStorage.getItem('adf_token') }) })
            .then(res => res.json()).then(res => { if(res.status === 'success') { allTransactions = res.data; applyFilters(); } });
        }

        function applyFilters() {
            let search = document.getElementById('searchInput').value.toLowerCase();
            let sort = document.getElementById('sortSLA').value;
            
            let filtered = allTransactions.filter(i => 
                i.TransNo.toLowerCase().includes(search) || i.SKU.toLowerCase().includes(search) || (i.Deskripsi||'').toLowerCase().includes(search)
            );
            
            if(sort === 'SLA_DESC') filtered.sort((a,b) => b.SLA_Hours - a.SLA_Hours); // Terlama
            else filtered.sort((a,b) => new Date(b.Date) - new Date(a.Date)); // Terbaru default Date creation

            renderHistory(filtered);
        }

        function renderHistory(data) {
            const dtBody = document.getElementById('desktopTableBody'), mbBody = document.getElementById('mobileCardBody');
            dtBody.innerHTML = ''; mbBody.innerHTML = '';
            if (data.length === 0) { mbBody.innerHTML = '<div class="text-center p-8 text-gray-400 flex flex-col items-center"><svg class="w-12 h-12 text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>Tidak ada data ditemukan.</div>'; return; }

            data.forEach(item => {
                let badgeColor = 'bg-yellow-100 text-yellow-700';
                if(item.Status === 'DONE_DEAL') badgeColor = 'bg-green-100 text-green-700';
                if(item.Status.includes('SENDBACK')) badgeColor = 'bg-red-100 text-red-700';
                
                let slaText = item.Status === 'DONE_DEAL' ? '-' : (item.SLA_Hours > 24 ? Math.floor(item.SLA_Hours/24)+' Hari' : Math.floor(item.SLA_Hours)+' Jam');
                let isTask = false;
                if(currentUser.role === 'Manager/Supervisor' && item.Status === 'PENDING_MGR') isTask = true;
                if(currentUser.role === 'MSO' && item.Status === 'PENDING_MSO') isTask = true;
                if(currentUser.role === 'Buyer' && item.Status === 'PENDING_BUYER') isTask = true;
                if(currentUser.role === 'Staff' && item.Status.includes('SENDBACK')) isTask = true;

                let rowClass = isTask ? 'bg-blue-50/50 cursor-pointer hover:bg-blue-50' : 'cursor-pointer hover:bg-gray-50';
                let indicator = isTask ? '<span class="w-2 h-2 rounded-full bg-red-500 absolute top-2 right-2 animate-pulse shadow-sm shadow-red-500/50"></span>' : '';

                dtBody.innerHTML += `
                    <tr class="${rowClass}" onclick="viewDetail('${item.TransNo}')">
                        <td class="p-4 text-xs">${item.Date}</td>
                        <td class="p-4"><p class="font-mono text-xs text-gray-500 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>${item.TransNo}</p><p class="font-bold">${item.Place}</p></td>
                        <td class="p-4 max-w-xs truncate"><p class="font-bold">${item.SKU}</p><p class="text-xs text-gray-500">${item.Deskripsi}</p></td>
                        <td class="p-4"><span class="text-xs font-bold flex items-center gap-1 ${isTask ? 'text-red-600' : 'text-gray-500'}"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>${slaText}</span></td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-md text-[10px] font-bold ${badgeColor}">${item.Status}</span></td>
                    </tr>
                `;

                mbBody.innerHTML += `
                    <div onclick="viewDetail('${item.TransNo}')" class="${rowClass} relative p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-2">
                        ${indicator}
                        <div class="flex justify-between items-start">
                            <div><p class="font-mono text-[10px] text-gray-400 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>${item.TransNo}</p><p class="font-bold text-sm">${item.Place}</p></div>
                            <span class="px-2 py-1 rounded-md text-[10px] font-bold ${badgeColor}">${item.Status}</span>
                        </div>
                        <div><p class="font-bold text-sm">${item.Deskripsi}</p><p class="text-xs ${isTask ? 'text-red-500 font-semibold' : 'text-gray-500'} flex items-center gap-1 mt-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> SLA: ${slaText}</p></div>
                    </div>
                `;
            });
        }

        // VIEW DETAILS & MODAL
        function viewDetail(transNo) {
            const item = allTransactions.find(t => t.TransNo === transNo);
            if(!item) return;

            document.getElementById('detailTransNo').innerHTML = `<svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> ${item.TransNo}`;
            
            let photosHtml = '<p class="text-gray-400 flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> Tidak ada foto</p>';
            if(item.Photos) {
                const urls = item.Photos.split(',');
                photosHtml = `<div class="flex gap-2 overflow-x-auto pb-2">` + urls.map(url => `
                    <img src="${url}" class="h-24 w-24 object-cover rounded-xl border border-gray-200 photo-thumb shadow-sm" onclick="zoomImage('${url}')">
                `).join('') + `</div>`;
            }

            let logHtml = item.HistoryLog ? item.HistoryLog.split('\n').map(l => l ? `<div class="pl-4 border-l-2 border-blue-400 py-1.5 text-xs text-gray-600 font-medium">${l}</div>` : '').join('') : '';

            document.getElementById('detailContent').innerHTML = `
                <div class="grid grid-cols-2 gap-y-3 gap-x-2 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                    <div><p class="text-[10px] text-gray-400 uppercase font-bold">Status</p><p class="font-bold text-blue-600">${item.Status}</p></div>
                    <div><p class="text-[10px] text-gray-400 uppercase font-bold">Store / Tgl</p><p class="font-semibold">${item.Place} <br><span class="font-normal text-xs text-gray-500">${item.Date}</span></p></div>
                    <div class="col-span-2"><p class="text-[10px] text-gray-400 uppercase font-bold">Barang</p><p class="font-bold">${item.Deskripsi} (${item.SKU})</p></div>
                    <div><p class="text-[10px] text-gray-400 uppercase font-bold">Proposal</p><p class="font-semibold">${item.Proposal}</p></div>
                    <div><p class="text-[10px] text-gray-400 uppercase font-bold">Caused By</p><p class="font-semibold">${item.CausedBy}</p></div>
                    <div class="col-span-2"><p class="text-[10px] text-gray-400 uppercase font-bold">Reason / Alasan</p><p class="bg-gray-50 p-2 rounded-lg text-xs mt-1 border border-gray-100">${item.Reason}</p></div>
                    ${item.Status === 'DONE_DEAL' ? `<div class="col-span-2 bg-green-50 p-3 rounded-lg flex items-start gap-2 border border-green-100"><svg class="w-5 h-5 text-green-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><div><p class="text-[10px] text-green-700 uppercase font-bold">Buyer Feedback</p><p class="font-bold text-sm text-green-900">Ket: ${item.BuyerCausedBy\vert{}\vert{}'-'} \vert{} Apprv Disc: Rp${item.BuyerApproveDiscount||0}</p></div></div>` : ''}
                </div>
                <div class="mt-4"><p class="text-xs font-bold text-gray-700 mb-2 flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> Bukti Foto (Ketuk untuk Zoom)</p>${photosHtml}</div>
                <div class="mt-4"><p class="text-xs font-bold text-gray-700 mb-2 flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Riwayat Jejak (History Log)</p><div class="space-y-1 bg-gray-50 p-3 rounded-xl border border-gray-100">${logHtml}</div></div>
            `;

            let canAction = false;
            if(currentUser.role === 'Manager/Supervisor' && item.Status === 'PENDING_MGR') canAction = true;
            if(currentUser.role === 'MSO' && item.Status === 'PENDING_MSO') canAction = true;
            if(currentUser.role === 'Buyer' && item.Status === 'PENDING_BUYER') canAction = true;
            if(currentUser.role === 'Staff' && item.Status.includes('SENDBACK')) canAction = true;

            const actionDiv = document.getElementById('detailActionBtn');
            if(canAction) {
                actionDiv.innerHTML = `
                    <button onclick="executeAction('${item.TransNo}', 'APPROVE')" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20 flex justify-center items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Setujui Task</button>
                    <button onclick="executeAction('${item.TransNo}', 'SENDBACK')" class="flex-1 bg-red-100 text-red-700 font-bold py-3 rounded-xl hover:bg-red-200 flex justify-center items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Send Back</button>
                `;
            } else {
                actionDiv.innerHTML = `<div class="w-full text-center text-gray-400 text-xs font-semibold py-2">Hanya bisa melihat riwayat (View Only)</div>`;
            }

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

        function zoomImage(url) {
            Swal.fire({ imageUrl: url, imageAlt: 'Bukti Foto', width: 'auto', padding: 0, showConfirmButton: false, customClass: { popup: 'bg-transparent' }, backdrop: `rgba(0,0,0,0.9)` });
        }

        function executeAction(transNo, actionType) {
            let isBuyerApprove = (currentUser.role === 'Buyer' && actionType === 'APPROVE');
            let buyerInputs = isBuyerApprove ? `
                <input type="text" id="bCause" class="ios-input mb-2 border-blue-200 focus:border-blue-500" placeholder="Feedback/Ket Buyer (Wajib)">
                <input type="number" id="bDisc" class="ios-input border-blue-200 focus:border-blue-500" placeholder="Approved Discount (Rp)">
            ` : '';
            
            Swal.fire({
                title: actionType === 'APPROVE' ? 'Setujui Pengajuan?' : 'Send Back Pengajuan?',
                html: `<div class="text-left mt-2"><label class="text-sm font-bold text-gray-700 block mb-1">Catatan Tambahan:</label><textarea id="actNote" class="ios-input h-20 mb-3" placeholder="${actionType==='SENDBACK'?'Wajib diisi jika Sendback...':'Opsional...'}"></textarea>${buyerInputs}</div>`,
                showCancelButton: true, confirmButtonText: 'Proses Data', confirmButtonColor: actionType === 'APPROVE'?'#3b82f6':'#ef4444',
                customClass: { popup: 'rounded-3xl glass-panel' },
                preConfirm: () => {
                    const note = document.getElementById('actNote').value;
                    if(actionType === 'SENDBACK' && !note) { Swal.showValidationMessage('Catatan wajib diisi!'); return false; }
                    return { note, bCause: document.getElementById('bCause')?.value||'', bDisc: document.getElementById('bDisc')?.value||0 };
                }
            }).then(r => {
                if(r.isConfirmed) {
                    Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', nik: currentUser.nik, username: currentUser.username, role: currentUser.role, token: localStorage.getItem('adf_token'), transNo: transNo, actionStatus: actionType, notes: r.value.note, buyerCausedBy: r.value.bCause, buyerApproveDiscount: r.value.bDisc, ip: userNetwork.ip, location: userNetwork.location }) })
                    .then(res => res.json()).then(res => {
                        if(res.status === 'success') { Swal.fire('Sukses', 'Status tiket berhasil diperbarui.', 'success'); closeDetailModal(); fetchHistory(); }
                        else Swal.fire('Error', res.message, 'error');
                    });
                }
            });
        }
    </script>
</body>
</html>
